[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/straydragon/lspz"
description = "AI-friendly LSP compression proxy"
readme = "README.md"
keywords = ["lsp", "proxy", "compression", "ai", "agent"]
categories = ["development-tools"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
