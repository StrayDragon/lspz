# yaml-language-server: $schema=https://raw.githubusercontent.com/StrayDragon/llman/main/artifacts/schema/configs/en/llmanspec-config.schema.json
schema: spec-driven
locale: zh-Hans

# 可选额外技能（默认禁用，取消注释以启用）
# 运行 `llman sdd init --update` 时，不在列表中的技能
# 会自动从 .agents/skills/ 目录中清理。
extra_skills:
  - llman-sdd-continue
  - llman-sdd-ff
  - llman-sdd-validate

# BDD 集成（可选，取消注释以启用）
# bdd:
#   framework: pytest-bdd
#   feature_dir: tests/features/
#   # default_language: zh-CN
#   # run_command: "pytest {feature_dir} -k {feature_name} -v"
#   # verify_prompt: |
#   #   将测试失败映射到对应的 requirement ID。
